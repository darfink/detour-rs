[package]
name = "detour"
version = "0.9.0"
authors = ["Elliott Linder <elliott.darfink@gmail.com>"]
description = "A cross-platform function detouring (inline hooking) library for x86, x86-64 and AArch64"
documentation = "https://docs.rs/detour"
homepage = "https://github.com/darfink/detour-rs"
repository = "https://github.com/darfink/detour-rs"
readme = "README.md"
keywords = ["detour", "hook", "function", "api", "redirect"]
categories = ["development-tools::ffi", "os"]
license = "BSD-2-Clause"
edition = "2024"
rust-version = "1.85"
include = ["src/**/*", "examples/**/*", "tests/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[features]
default = ["std"]
# Use the standard library (locks, `std::io::Error` conversions).
std = ["region/std", "iced-x86/std"]
# Support `#![no_std]` environments (requires `alloc`). Mutually exclusive
# with `std` on x86, due to `iced-x86`.
no_std = ["dep:spin", "iced-x86/no_std"]

[dependencies]
spin = { version = "0.12.0", default-features = false, features = ["mutex", "spin_mutex", "rwlock"], optional = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
region = { version = "4.0.0", default-features = false }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "block_encoder", "instr_info"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.172", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.172"
region = "4.0.0"

[target.'cfg(windows)'.dev-dependencies]
region = "4.0.0"
windows-sys = { version = "0.61.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "messageboxw_detour"
crate-type = ["cdylib"]

[[example]]
name = "early_hook"
crate-type = ["cdylib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
